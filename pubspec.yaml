name: conflictsense
description: Real-time conflict intelligence platform with multi-agent analysis.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.19.0
  fl_chart: ^0.69.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_database: ^11.1.6
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2
  google_maps_flutter: ^2.9.0
  google_generative_ai: ^0.4.6
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  collection: ^1.19.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
